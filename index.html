<html lang="id">
<head>

<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#12343b;font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.3;color:var(--ink)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:none;gap:6px;flex-wrap:wrap;pointer-events:none;font-size:15px}
#hud.on{display:flex}
#hud span,#hud button{background:#12343bd9;color:#fff;border-radius:999px;padding:1px 11px;font:inherit;font-weight:700;border:0}
#hud button{pointer-events:auto;background:var(--sun);color:#2a1d00;cursor:pointer}
#jr,#jk{position:fixed;border-radius:50%;display:none;pointer-events:none;z-index:2}
#jr{width:100px;height:100px;border:3px solid #fffa}
#jk{width:40px;height:40px;background:#fff9}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#12343bcc;z-index:5}
.scr.on{display:flex}
.card{background:var(--paper);color:var(--ink);border-radius:18px;padding:16px;width:min(100%,460px);max-height:92%;overflow:auto;border:3px solid var(--panel)}
.card h1{font-size:1.5rem;margin:0 0 2px;text-align:center;font-weight:800}
.card h2{margin:2px 0 6px;font-size:1.15rem;text-align:center}
.card p{margin:0 0 10px}
.big{font-size:3rem;text-align:center;line-height:1.1}
.sm{font-size:.85rem;text-align:center;opacity:.8}
label{font-weight:700;display:block;margin:8px 0 4px}
#nm{width:100%;font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink)}
.chs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chs button{font:inherit;font-size:2.3rem;line-height:1.1;padding:6px 0 2px;border-radius:14px;border:3px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chs button small{display:block;font-size:.7rem;font-weight:700}
.chs button.sel{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 25%,transparent)}
.opt{display:block;width:100%;text-align:left;font:inherit;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--leaf)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 22%,transparent)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,transparent)}
.fb{font-weight:700}.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.go{font:inherit;font-weight:700;background:var(--sun);color:#2a1d00;border:0;border-radius:12px;padding:8px 20px;cursor:pointer;display:block;margin:10px auto 0}
.jg{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;text-align:center;font-size:.75rem}
.jg img{width:44px;height:44px}
.jg .lock img{filter:grayscale(1) brightness(.3);opacity:.55}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>

function rs(){R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.setSize(innerWidth,innerHeight,false);CAM.aspect=innerWidth/innerHeight;CAM.updateProjectionMatrix()}
addEventListener("resize",rs);rs();setPl();
var cs=1;
function frame(t){var dt=Math.min(.05,(t-last)/1000||0);last=t;if(playing&&!paused)step(dt);
var s=Math.min(2,Math.max(1,.95/CAM.aspect)),tx=P.x,ty=15*s,tz=P.z+17*s,k=Math.min(1,dt*5);
if(!playing){tx=-45;tz=17*s}CAM.position.x+=(tx-CAM.position.x)*k;CAM.position.y+=(ty-CAM.position.y)*k;CAM.position.z+=(tz-CAM.position.z)*k;CAM.lookAt(CAM.position.x,0,CAM.position.z-17*s);
var b=Math.sin(t/300);C.forEach(function(c){if(c.res)return;c.sp.position.y=c.by+b*.18*(c.ph%2?1:-1);c.qs2.position.y=c.by+2+b*.1});
pl.position.set(P.x,(boat?1.2:1.6)+Math.abs(b)*.08,P.z);shadow.position.set(P.x,.05,P.z);if(lb)lb.position.set(P.x,boat?3.3:3.8,P.z);shadow.visible=!boat;boatG.visible=boat;boatG.position.set(P.x,-.45+b*.06,P.z);boatG.rotation.y=hd;
R.render(S,CAM);requestAnimationFrame(frame)}
function step(dt){var vx=0,vz=0,m,nx,nz,sp;
if(keys.ArrowLeft||keys.a)vx--;if(keys.ArrowRight||keys.d)vx++;if(keys.ArrowUp||keys.w)vz--;if(keys.ArrowDown||keys.s)vz++;
if(stick){vx+=stick.dx;vz+=stick.dy}m=Math.hypot(vx,vz);if(m>1){vx/=m;vz/=m}
sp=boat?12:8;nx=Math.max(-88,Math.min(136,P.x+vx*sp*dt));nz=Math.max(-57,Math.min(57,P.z+vz*sp*dt));
if(zone(nx,P.z)!="r")P.x=nx;if(zone(P.x,nz)!="r")P.z=nz;boat=P.x>61;if(m>.1)hd=Math.atan2(-vz,vx);
var d=P.x-rx(P.z),zz=P.x>61?"Laut":d<-6?"Hutan":d>6?"Savana":"Sungai";if(zz!=curZ){curZ=zz;document.getElementById("hb").textContent=zz}
for(var i=0;i<C.length;i++){var c=C[i],q=Math.hypot(c.x-P.x,c.z-P.z);if(q<5.5&&!c.res){ask(c);return}}}
/* kontrol sentuh: geser jari seperti joystick */
var jr=document.getElementById("jr"),jk=document.getElementById("jk");
function jpos(x,y,kx,ky){jr.style.left=x-50+"px";jr.style.top=y-50+"px";jk.style.left=kx-20+"px";jk.style.top=ky-20+"px"}
cv.onpointerdown=function(e){if(!playing||paused)return;cv.setPointerCapture(e.pointerId);stick={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0};jr.style.display=jk.style.display="block";jpos(e.clientX,e.clientY,e.clientX,e.clientY)};
cv.onpointermove=function(e){if(!stick||e.pointerId!=stick.id)return;var dx=(e.clientX-stick.ox)/50,dy=(e.clientY-stick.oy)/50,m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}stick.dx=dx;stick.dy=dy;jpos(stick.ox,stick.oy,stick.ox+dx*50,stick.oy+dy*50)};
cv.onpointerup=cv.onpointercancel=function(){stick=null;jr.style.display=jk.style.display="none"};
addEventListener("keydown",function(e){if(!playing||paused)return;if(e.key.indexOf("Arrow")==0)e.preventDefault();keys[e.key]=1});
addEventListener("keyup",function(e){delete keys[e.key]});
/* soal, jurnal, login */
var ov=document.getElementById("ov"),cd=document.getElementById("cd");
function show(h){cd.innerHTML=h;ov.classList.add("on");paused=true;stick=null;keys={};jr.style.display=jk.style.display="none"}
function hide(){ov.classList.remove("on");paused=false}
function hud(){var n=C.filter(function(c){return c.got}).length;document.getElementById("hs").textContent="Skor "+score;document.getElementById("hc").textContent=n+"/"+C.length;return n}
function fmt(){var s=Math.floor((Date.now()-t0)/1000);return("0"+Math.floor(s/60)).slice(-2)+":"+("0"+s%60).slice(-2)}
function ask(c){RS[c.id]="p";save();c.qs=build(c);c.i=0;c.w=0;nextQ(c)}
function nextQ(c){var q=c.qs[c.i];show('<div class="big"></div><h2>Ada '+c.n+' liar!</h2><p class="sm">Soal '+(c.i+1)+' dari '+c.qs.length+'</p><p></p><div id="ops"></div><div id="res"></div>');
var im=new Image();im.src=c.cv.toDataURL();im.width=64;im.alt=c.n;cd.querySelector(".big").appendChild(im);
cd.querySelector("p:not(.sm)").textContent=q.q;var ops=cd.querySelector("#ops");
shuf(q.o).forEach(function(o){var b=document.createElement("button");b.type="button";b.className="opt";if(q.u)o.split(" ").forEach(function(w,i){if(i)b.appendChild(document.createTextNode(" "));var u=document.createElement("u");u.textContent=w;b.appendChild(u)});else b.textContent=o;b.onclick=function(){pick(c,q,o,b)};ops.appendChild(b)});ops.firstChild.focus()}
function pick(c,q,o,b){var ok=o==q.a,last=c.i==c.qs.length-1;
[].forEach.call(cd.querySelectorAll(".opt"),function(x){x.disabled=true;if(x.textContent==q.a)x.classList.add("ok")});if(!ok){b.classList.add("no");c.w++}else score+=10;save();
var r=cd.querySelector("#res");r.innerHTML='<p class="fb '+(ok?"ok":"no")+'"></p><p></p><button type="button" class="go"></button>';
r.children[0].textContent=ok?"Benar! +10":"Belum tepat.";r.children[1].textContent=q.t;
var g=r.querySelector(".go");g.textContent=last?"Selesai":"Lanjut";g.onclick=function(){if(last)done(c);else{c.i++;nextQ(c)}};g.focus();hud()}
function done(c){var n=c.qs.length,ok=c.w<n,full=c.w==0;c.res=ok?"g":"f";RS[c.id]=c.res;c.sp.visible=false;c.qs2.visible=false;if(ok)c.got=true;if(full)score+=10;save();hud();
show('<div class="big">'+(ok?(full?"🎉":"👍"):"💨")+'</div><h2>'+(ok?c.n+" tertangkap!":c.n+" kabur!")+'</h2><p class="sm"></p><button type="button" class="go">Lanjut</button>');
cd.querySelector(".sm").textContent=full?path(c):ok?(n-c.w)+" dari "+n+" jawabanmu benar.":"Semua jawabanmu kurang tepat, jadi "+c.n+" kabur dan tidak bisa ditangkap lagi.";
cd.querySelector(".go").onclick=function(){hide();hud();if(C.every(function(x){return x.res}))end()}}
function end(){clearInterval(tm);show('<div class="big">🏆</div><h2></h2><p style="text-align:center">Petualangan selesai!<br>Tertangkap: <b>'+C.filter(function(x){return x.got}).length+'/'+C.length+'</b><br>Skor akhir: <b>'+score+'</b><br>Waktu: <b>'+fmt()+'</b></p><p class="sm">Foto layar ini dan kirim ke gurumu.</p>');cd.querySelector("h2").textContent="Selesai, "+pname+"!"}
document.getElementById("hj").onclick=function(){if(paused)return;var h='<h2>Jurnal Penjelajah</h2><div class="jg">';
C.forEach(function(c){h+='<span class="'+(c.got?"":"lock")+'"><img alt="" src="'+c.cv.toDataURL()+'"><br>'+(c.got?c.n:c.res?"Kabur":"???")+'</span>'});
show(h+'</div><button type="button" class="go">Tutup</button>');cd.querySelector(".go").onclick=hide};
var chs=document.getElementById("chs"),tm;
CH.forEach(function(c,i){var b=document.createElement("button");b.type="button";b.innerHTML=c[1]+"<small>"+c[2]+"</small>";b.setAttribute("aria-label",c[2]);if(!i)b.className="sel";
b.onclick=function(){ci=i;[].forEach.call(chs.children,function(x,j){x.className=j==i?"sel":""});setPl()};chs.appendChild(b)});
try{document.getElementById("nm").value=localStorage.getItem("klas_nama")||""}catch(e){}

document.getElementById("hn").textContent=CH[ci][1]+" "+pname;setLbl();document.getElementById("lg").classList.remove("on");document.getElementById("hud").classList.add("on");
var s=null,el=0,k;try{s=JSON.parse(localStorage.getItem("klas_v3"))}catch(e){}RS={};if(s&&s.n==pname){score=s.s||0;RS=s.r||{};el=s.e||0;bnMap=s.b||{};if(Object.keys(bnMap).length)asg(bnMap);else asg();for(k in RS)if(RS[k]=="p")RS[k]="f"}else{score=0;asg()}C.forEach(function(c){var r=RS[c.id];c.res=r;c.got=r=="g";if(r){c.sp.visible=false;c.qs2.visible=false}});playing=true;paused=false;t0=Date.now()-el*1000;tm=setInterval(function(){document.getElementById("ht").textContent=fmt()},1000);save();hud();if(C.every(function(c){return c.res}))end()};
requestAnimationFrame(frame);
